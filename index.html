<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Mini Charts</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="renderer.js"></script>
  </head>
  <body data-theme="dark">
    <header class="app-bar">
      <div class="app-title">TV Mini Charts</div>
      <div class="app-bar-right">
        <span id="clockJst" class="app-time" aria-live="polite">--:-- JST</span>
        <button id="settingsToggle" class="icon-button" type="button" aria-label="Open settings">
          &#9881;
        </button>
      </div>
    </header>

    <main id="chartsContainer" class="charts"></main>

    <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
      <div class="settings-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-button" type="button" aria-label="Close settings">
          x
        </button>
      </div>

      <label class="control">
        <span>Theme</span>
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>

      <label class="control">
        <span>Chart width</span>
        <input id="chartWidthInput" type="number" min="160" max="800" step="10" />
      </label>

      <label class="control">
        <span>Chart height</span>
        <input id="chartHeightInput" type="number" min="120" max="600" step="10" />
      </label>

      <label class="control">
        <span>Chart count</span>
        <input id="tileCountInput" type="number" min="1" max="12" step="1" />
      </label>

      <label class="control switch">
        <span>Always on top</span>
        <input id="alwaysOnTopToggle" type="checkbox" />
      </label>

      <section class="chart-settings">
        <h3>Charts</h3>
        <div id="tilesEditor" class="tiles-editor"></div>
      </section>
    </aside>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </body>
</html>
